name: Change request
description: A new map, mod or plugin, a change of the rules or settings, or another change to the configuration
labels: [enhancement]
body:
  - type: dropdown
    id: config
    attributes:
      label: Configuration
      description: The configuration sets the change is for
      multiple: true
      options:
        - coop-commando
        - mp-battles
        - private-mp
        - all of them
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What should change?
      description: For a map or mod, a link to its Steam Workshop page
    validations:
      required: true
