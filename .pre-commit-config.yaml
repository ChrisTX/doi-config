# Checks for pre-commit (https://pre-commit.com, the pre-commit or prek package), run before each commit
# after `prek install`. The hooks use the tools of the Arch Linux packages named in brackets, nothing is
# downloaded.

# `prek install` installs the hook of the commit message as well. The checks run before the commit
# (or on request), only the typos-commit-msg hook runs for the commit message.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  - repo: local
    hooks:
      # Binaries don't belong into the repository
      - id: no-binaries
        name: no downloaded or built files
        language: fail
        entry: Downloaded and built files belong into .gitignore
        files: \.(smx|vpk|bsp|zip|tar|tgz|gz|bz2|xz|zst|7z|mmdb|so|dll|exe)$

      # A symbolic link points to a file of the repository: a broken one would leave a server without
      # the file, like private-mp's motd.txt after the files moved
      - id: symlinks
        name: no broken symbolic links
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          if [[ ! -e $f ]]; then echo "$f: broken symbolic link to $(readlink "$f")"; status=1;
          elif [[ $(realpath "$f") != "$PWD"/* ]]; then echo "$f: links out of the repository"; status=1;
          fi; done; exit "$status"' --
        types: [symlink]

      - id: shfmt
        name: shfmt (shfmt)
        language: system
        entry: shfmt --write
        types: [shell]
      - id: shellcheck
        name: shellcheck (shellcheck)
        language: system
        entry: shellcheck
        types: [shell]
      - id: shellharden
        name: shellharden (shellharden)
        language: system
        entry: shellharden --check
        types: [shell]

      - id: ruff-check
        name: ruff check (ruff)
        language: system
        entry: ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format (ruff)
        language: system
        entry: ruff format
        types: [python]
      # The types of the Python code, the package, the checks and the tests as pyproject.toml has them,
      # all at once: types cross the modules
      - id: mypy
        name: mypy (mypy)
        language: system
        entry: mypy
        types: [python]
        pass_filenames: false
      # The tests of the package (tests/unit/), all of them on any change
      - id: pytest
        name: pytest (python-pytest)
        language: system
        entry: python3 -m pytest -q
        types: [python]
        pass_filenames: false

      # The plugins compile, the integration tests' too, warnings as errors, with the include folder
      # of the repository (AFK Manager's). spcomp takes one plugin per run. Nothing is written, the
      # plugins are built on the server. Include files can't be compiled on their own, they're
      # checked with the plugins.
      - id: spcomp
        name: spcomp (sourcemod-scripting, AUR)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          spcomp -E -i game/common/addons/sourcemod/scripting/include -o /dev/null "$f" || status=1;
          done; exit "$status"' --
        files: ^(game/common/addons/sourcemod/scripting|tests/integration/plugins)/[^/]+\.sp$

      # The game's configs: formatted, the cvar bare and its arguments quoted, and checked against the
      # game's cvars and commands (checks/cvars/<game>.json, made with checks/dump_cvars.py) and those of our
      # plugins, see checks/check_configs.py. It checks all configs, as a change of the cvars or the
      # plugins can make any of them wrong.
      - id: check-configs
        name: the game's configs (checks/check_configs.py)
        language: system
        entry: python3 checks/check_configs.py
        pass_filenames: false
        files: \.cfg$|^checks/(cvars/[^/]+\.json|commands\.toml|check_configs\.py)$|^game/common/addons/sourcemod/(scripting/|configs/nwi_cvar_unlocker\.cfg$)|^servers/[^/]+/server\.toml$

      # The servers' settings: their keys, and the configs and lists they name (nwi-server server-config)
      - id: server-config
        name: the servers' settings (nwi-server server-config)
        language: system
        entry: env PYTHONPATH=src python3 -m nwi_server_kit server-config check
        files: ^(tests/integration/)?servers/[^/]+/server\.toml$

      # The container image's packages against the package's dependencies (checks/check_packages.py)
      - id: check-packages
        name: the image's packages (checks/check_packages.py)
        language: system
        entry: python3 checks/check_packages.py
        pass_filenames: false
        files: ^(deploy/arch/PKGBUILD|deploy/container/Containerfile|checks/check_packages\.py)$

      # The C++ of the Ghidra tools (src/hl2sdk_ghidra/sdk_types.cpp), which hl2sdk-ghidra types compiles
      # against the SDK, and the C of the tests' stand-in of the Steamworks API, formatted with clang-format
      - id: clang-format
        name: clang-format (clang)
        language: system
        entry: clang-format -i
        types_or: [c, c++]

      # The Containerfile: hadolint (from the AUR), with shellcheck for its RUN instructions, and trivy's
      # checks of its configuration, the ones trivy comes with (--skip-check-update, nothing is downloaded)
      - id: hadolint
        name: hadolint (hadolint, AUR)
        language: system
        entry: hadolint
        files: (^|/)(Containerfile|Dockerfile)$
      # trivy takes one file a run
      - id: trivy-config
        name: trivy config (trivy)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          trivy config --skip-check-update --quiet --exit-code 1 "$f" || status=1;
          done; exit "$status"' --
        files: (^|/)(Containerfile|Dockerfile)$

      # systemd-lsp exits with 0 on findings
      - id: systemd-lsp
        name: systemd-lsp (systemd-lsp)
        language: system
        entry: >-
          bash -c 'out=$(systemd-lsp "$@" 2>&1); status=$?; printf "%s\n" "$out";
          if grep -qE "(warning|error)" <<<"$out"; then status=1; fi; exit "$status"' --
        files: \.(service|socket|timer|target|mount|automount|swap|path|slice|scope)$

      - id: yamllint
        name: yamllint (yamllint)
        language: system
        entry: yamllint --strict
        types: [yaml]

      # TOML: REUSE.toml, .typos.toml and the mods' definitions (mods/<game>/*.toml)
      - id: tombi-format
        name: tombi format (tombi)
        language: system
        entry: tombi format --offline
        types: [toml]
      - id: tombi-lint
        name: tombi lint (tombi)
        language: system
        entry: tombi lint --offline
        types: [toml]

      # Paragraphs and list items may be long lines, one per item, instead of wrapped at 80 characters
      - id: rumdl-fmt
        name: rumdl fmt (rumdl)
        language: system
        entry: rumdl fmt --config 'MD013.paragraphs = false'
        types: [markdown]
      - id: rumdl-check
        name: rumdl check (rumdl)
        language: system
        entry: rumdl check --config 'MD013.paragraphs = false'
        types: [markdown]

      # British English, settings in .typos.toml. --force-exclude: its excludes also apply to the
      # files prek passes.
      - id: typos
        name: typos (typos)
        language: system
        entry: typos --force-exclude
        types: [text]

      # The summary of the commit message: its scope and form, see CONTRIBUTING.md
      - id: commit-msg-summary
        name: summary of the commit message
        language: system
        entry: checks/check_commit_msg.sh
        stages: [commit-msg]

      # The commit message, without git's comments and the diff below them of `git commit -v`
      - id: typos-commit-msg
        name: typos of the commit message (typos)
        language: system
        entry: >-
          bash -c 'sed "/^# -* >8 -*\$/,\$d" "$1" | grep -v "^#" | typos -' --
        stages: [commit-msg]

      # The formatters take care of the indentation of the languages they know, the indent size of the
      # game's configuration files is up to the author. Patches and licence texts stay as they are.
      - id: editorconfig-checker
        name: editorconfig-checker (editorconfig-checker)
        language: system
        entry: editorconfig-checker -disable-indent-size
        types: [text]
        exclude: \.(patch|diff)$|^LICENSES?(/|$)

      - id: reuse
        name: reuse lint-file (reuse)
        language: system
        entry: reuse lint-file
        types: [file]
      - id: reuse-lint
        name: reuse lint (reuse)
        language: system
        entry: reuse lint --quiet
        pass_filenames: false
        always_run: true
