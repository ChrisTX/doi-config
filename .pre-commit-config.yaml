# Checks for pre-commit (https://pre-commit.com, the pre-commit or prek package), run before each commit
# after `prek install`. The hooks use the tools of the Arch Linux packages named in brackets, nothing is
# downloaded.
repos:
  - repo: local
    hooks:
      # Binaries don't belong into the repository
      - id: no-binaries
        name: no downloaded or built files
        language: fail
        entry: Downloaded and built files belong into .gitignore
        files: \.(smx|vpk|bsp|zip|tar|tgz|gz|bz2|xz|zst|7z|mmdb|so|dll|exe)$

      - id: shfmt
        name: shfmt (shfmt)
        language: system
        entry: shfmt --write
        types: [shell]
      - id: shellcheck
        name: shellcheck (shellcheck)
        language: system
        entry: shellcheck
        types: [shell]
      - id: shellharden
        name: shellharden (shellharden)
        language: system
        entry: shellharden --check
        types: [shell]

      - id: ruff-check
        name: ruff check (ruff)
        language: system
        entry: ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format (ruff)
        language: system
        entry: ruff format
        types: [python]

      # The plugins compile, warnings as errors, with the include folder of the repository (AFK
      # Manager's). spcomp takes one plugin per run. Nothing is written, the plugins are built on the
      # server. Include files can't be compiled on their own, they're checked with the plugins.
      - id: spcomp
        name: spcomp (sourcemod-scripting, AUR)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          spcomp -E -i game/addons/sourcemod/scripting/include -o /dev/null "$f" || status=1;
          done; exit "$status"' --
        files: ^game/addons/sourcemod/scripting/[^/]+\.sp$

      # systemd-lsp exits with 0 on findings
      - id: systemd-lsp
        name: systemd-lsp (systemd-lsp)
        language: system
        entry: >-
          bash -c 'out=$(systemd-lsp "$@" 2>&1); status=$?; printf "%s\n" "$out";
          if grep -qE "(warning|error)" <<<"$out"; then status=1; fi; exit "$status"' --
        files: \.(service|socket|timer|target|mount|automount|swap|path|slice|scope)$

      - id: yamllint
        name: yamllint (yamllint)
        language: system
        entry: yamllint --strict
        types: [yaml]

      # Paragraphs and list items may be long lines, one per item, instead of wrapped at 80 characters
      - id: rumdl-fmt
        name: rumdl fmt (rumdl)
        language: system
        entry: rumdl fmt --config 'MD013.paragraphs = false'
        types: [markdown]
      - id: rumdl-check
        name: rumdl check (rumdl)
        language: system
        entry: rumdl check --config 'MD013.paragraphs = false'
        types: [markdown]

      # British English, settings in .typos.toml. --force-exclude: its excludes also apply to the
      # files prek passes.
      - id: typos
        name: typos (typos)
        language: system
        entry: typos --force-exclude
        types: [text]

      # The formatters take care of the indentation of the languages they know, the indent size of the
      # game's configuration files is up to the author. Patches and licence texts stay as they are.
      - id: editorconfig-checker
        name: editorconfig-checker (editorconfig-checker)
        language: system
        entry: editorconfig-checker -disable-indent-size
        types: [text]
        exclude: \.(patch|diff)$|^LICENSES?(/|$)

      - id: reuse
        name: reuse lint-file (reuse)
        language: system
        entry: reuse lint-file
        types: [file]
      - id: reuse-lint
        name: reuse lint (reuse)
        language: system
        entry: reuse lint --quiet
        pass_filenames: false
        always_run: true
