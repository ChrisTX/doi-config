# Checks for pre-commit (https://pre-commit.com, the pre-commit or prek package), run before each commit
# after `prek install`. The hooks use the tools of the Arch Linux packages named in brackets, nothing is
# downloaded.

# `prek install` installs the hook of the commit message as well. The checks run before the commit
# (or on request), only the typos-commit-msg hook runs for the commit message.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  - repo: local
    hooks:
      # Binaries don't belong into the repository
      - id: no-binaries
        name: no downloaded or built files
        language: fail
        entry: Downloaded and built files belong into .gitignore
        files: \.(smx|vpk|bsp|zip|tar|tgz|gz|bz2|xz|zst|7z|mmdb|so|dll|exe)$

      # A symbolic link points to a file of the repository: a broken one would leave a server without
      # the file, like private-mp's motd.txt after the files moved
      - id: symlinks
        name: no broken symbolic links
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          if [[ ! -e $f ]]; then echo "$f: broken symbolic link to $(readlink "$f")"; status=1;
          elif [[ $(realpath "$f") != "$PWD"/* ]]; then echo "$f: links out of the repository"; status=1;
          fi; done; exit "$status"' --
        types: [symlink]

      - id: shfmt
        name: shfmt (shfmt)
        language: system
        entry: shfmt --write
        types: [shell]
      - id: shellcheck
        name: shellcheck (shellcheck)
        language: system
        entry: shellcheck
        types: [shell]
      - id: shellharden
        name: shellharden (shellharden)
        language: system
        entry: shellharden --check
        types: [shell]

      - id: ruff-check
        name: ruff check (ruff)
        language: system
        entry: ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format (ruff)
        language: system
        entry: ruff format
        types: [python]

      # The plugins compile, warnings as errors, with the include folder of the repository (AFK
      # Manager's). spcomp takes one plugin per run. Nothing is written, the plugins are built on the
      # server. Include files can't be compiled on their own, they're checked with the plugins.
      - id: spcomp
        name: spcomp (sourcemod-scripting, AUR)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          spcomp -E -i game/addons/sourcemod/scripting/include -o /dev/null "$f" || status=1;
          done; exit "$status"' --
        files: ^game/addons/sourcemod/scripting/[^/]+\.sp$

      # The game's configs: formatted, the cvar bare and its arguments quoted, and checked against the
      # game's cvars and commands (tools/cvars.json, made with tools/dump_cvars.py) and those of our
      # plugins, see tools/check_configs.py. It checks all configs, as a change of the cvars or the
      # plugins can make any of them wrong.
      - id: check-configs
        name: the game's configs (tools/check_configs.py)
        language: system
        entry: python3 tools/check_configs.py
        pass_filenames: false
        files: \.cfg$|^tools/(cvars\.json|check_configs\.py)$|^game/addons/sourcemod/scripting/

      # The servers' settings: their keys, and the configs and lists they name (tools/server_config.py)
      - id: server-config
        name: the servers' settings (tools/server_config.py)
        language: system
        entry: tools/server_config.py check
        files: ^servers/[^/]+/server\.toml$

      # The patcher of the server library (tools/doi_patch.c): formatted with clang-format, checked with
      # clang-tidy (.clang-tidy) and compiled with gcc and clang, warnings as errors, both of its builds:
      # the library for srcds, 32-bit, and the program (DOI_PATCH_FILE)
      - id: clang-format
        name: clang-format (clang)
        language: system
        entry: clang-format -i
        types: [c]
      - id: clang-tidy
        name: clang-tidy (clang, lib32-glibc)
        language: system
        entry: >-
          bash -c 'clang-tidy --quiet "$@" -- -m32 -std=c23 &&
          clang-tidy --quiet "$@" -- -std=c23 -DDOI_PATCH_FILE' --
        types: [c]
      - id: gcc
        name: gcc, both builds (gcc, lib32-gcc-libs, lib32-glibc)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          gcc -m32 -std=c23 -O2 -shared -fPIC -Wall -Wextra -Wpedantic -Werror -o /dev/null "$f" || status=1;
          gcc -std=c23 -O2 -DDOI_PATCH_FILE -Wall -Wextra -Wpedantic -Werror -o /dev/null "$f" || status=1;
          done; exit "$status"' --
        types: [c]
      # The same with clang, whose warnings differ from gcc's
      - id: clang
        name: clang, both builds (clang, lib32-gcc-libs, lib32-glibc)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          clang -m32 -std=c23 -O2 -shared -fPIC -Wall -Wextra -Wpedantic -Werror -o /dev/null "$f" || status=1;
          clang -std=c23 -O2 -DDOI_PATCH_FILE -Wall -Wextra -Wpedantic -Werror -o /dev/null "$f" || status=1;
          done; exit "$status"' --
        types: [c]

      # The Ghidra scripts (tools/ghidra/*.java): formatted with google-java-format, compiled against
      # Ghidra's jars (tools/ghidra/classpath.sh) for the Java of Ghidra, 21, with every warning as an
      # error, and linted with PMD's rules for Java it recommends (tools/ghidra/pmd-ruleset.xml), with
      # Java 21's classes. Not the path warnings: some of Ghidra's jars name jars in their manifests that
      # Ghidra doesn't ship. Nothing is written, the scripts are compiled by Ghidra when they run.
      - id: google-java-format
        name: google-java-format (google-java-format, AUR)
        language: system
        entry: google-java-format --replace
        types: [java]
      - id: javac
        name: javac (jdk21-openjdk or later, ghidra)
        language: system
        entry: >-
          bash -c 'classpath=$(tools/ghidra/classpath.sh) && out=$(mktemp -d) &&
          trap "rm -rf \"\$out\"" EXIT &&
          javac --release 21 -Xlint:all,-path -Werror -proc:none -cp "$classpath" -d "$out" "$@"' --
        files: ^tools/ghidra/[^/]+\.java$
      - id: pmd
        name: pmd (pmd, AUR, ghidra, jdk21-openjdk)
        language: system
        entry: >-
          bash -c 'classpath=$(tools/ghidra/classpath.sh) &&
          pmd check --no-progress --no-cache --rulesets tools/ghidra/pmd-ruleset.xml
          --aux-classpath "$classpath:/usr/lib/jvm/java-21-openjdk/lib/jrt-fs.jar" --dir "$@"' --
        files: ^tools/ghidra/[^/]+\.java$

      # The Containerfile: hadolint (from the AUR), with shellcheck for its RUN instructions, and trivy's
      # checks of its configuration, the ones trivy comes with (--skip-check-update, nothing is downloaded)
      - id: hadolint
        name: hadolint (hadolint, AUR)
        language: system
        entry: hadolint
        files: (^|/)(Containerfile|Dockerfile)$
      # trivy takes one file a run
      - id: trivy-config
        name: trivy config (trivy)
        language: system
        entry: >-
          bash -c 'status=0; for f; do
          trivy config --skip-check-update --quiet --exit-code 1 "$f" || status=1;
          done; exit "$status"' --
        files: (^|/)(Containerfile|Dockerfile)$

      # systemd-lsp exits with 0 on findings
      - id: systemd-lsp
        name: systemd-lsp (systemd-lsp)
        language: system
        entry: >-
          bash -c 'out=$(systemd-lsp "$@" 2>&1); status=$?; printf "%s\n" "$out";
          if grep -qE "(warning|error)" <<<"$out"; then status=1; fi; exit "$status"' --
        files: \.(service|socket|timer|target|mount|automount|swap|path|slice|scope)$

      - id: yamllint
        name: yamllint (yamllint)
        language: system
        entry: yamllint --strict
        types: [yaml]

      # TOML: REUSE.toml, .typos.toml and the mods' definitions (mods/*.toml)
      - id: tombi-format
        name: tombi format (tombi)
        language: system
        entry: tombi format --offline
        types: [toml]
      - id: tombi-lint
        name: tombi lint (tombi)
        language: system
        entry: tombi lint --offline
        types: [toml]

      # Paragraphs and list items may be long lines, one per item, instead of wrapped at 80 characters
      - id: rumdl-fmt
        name: rumdl fmt (rumdl)
        language: system
        entry: rumdl fmt --config 'MD013.paragraphs = false'
        types: [markdown]
      - id: rumdl-check
        name: rumdl check (rumdl)
        language: system
        entry: rumdl check --config 'MD013.paragraphs = false'
        types: [markdown]

      # British English, settings in .typos.toml. --force-exclude: its excludes also apply to the
      # files prek passes.
      - id: typos
        name: typos (typos)
        language: system
        entry: typos --force-exclude
        types: [text]

      # The summary of the commit message: its scope and form, see CONTRIBUTING.md
      - id: commit-msg-summary
        name: summary of the commit message
        language: system
        entry: tools/check_commit_msg.sh
        stages: [commit-msg]

      # The commit message, without git's comments and the diff below them of `git commit -v`
      - id: typos-commit-msg
        name: typos of the commit message (typos)
        language: system
        entry: >-
          bash -c 'sed "/^# -* >8 -*\$/,\$d" "$1" | grep -v "^#" | typos -' --
        stages: [commit-msg]

      # The formatters take care of the indentation of the languages they know, the indent size of the
      # game's configuration files is up to the author. Patches and licence texts stay as they are.
      - id: editorconfig-checker
        name: editorconfig-checker (editorconfig-checker)
        language: system
        entry: editorconfig-checker -disable-indent-size
        types: [text]
        exclude: \.(patch|diff)$|^LICENSES?(/|$)

      - id: reuse
        name: reuse lint-file (reuse)
        language: system
        entry: reuse lint-file
        types: [file]
      - id: reuse-lint
        name: reuse lint (reuse)
        language: system
        entry: reuse lint --quiet
        pass_filenames: false
        always_run: true
