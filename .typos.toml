# Spell checking with typos (https://github.com/crate-ci/typos, the typos package), in British English:
# American spellings are reported too. Names keep their spelling, see CONTRIBUTING.md.

[default]
locale = "en-gb"
extend-ignore-re = [
  # Command-line options (--innodb_initialized, --armor)
  "(?:^|[\\s\"'(=])--?[A-Za-z][-A-Za-z0-9_:]*",
  # Advertisements' message type
  "\\bcenter:",
  # SourceBans++'s file of its tables
  "\\bstruc\\.sql\\b",
  # The SourceMod library AFK Manager needs
  "Multi-Colors",
  # The names of the maps' control points, spawn zones and entities in the mods' rules
  "\"[a-z][a-z0-9_]*_[a-z0-9_]*\"",
  # PyGhidra's function that analyses a program
  '\bpyghidra\.analyze\b',
  # The cryptography library's module of key formats
  '\bserialization\.',
  'import hashes, serialization\b',
]

[default.extend-words]
# The game's term, also in its cvars (mp_theater_override) and THEATER
theater = "theater"
# The terms of software, also in British English: the compilers' sanitizers (-fsanitize,
# UndefinedBehaviorSanitizer), as in the AUR packages
sanitize = "sanitize"
sanitizer = "sanitizer"
sanitizers = "sanitizers"

[default.extend-identifiers]
# The name of Clang's and GCC's sanitizer of undefined behaviour
UndefinedBehaviorSanitizer = "UndefinedBehaviorSanitizer"
# DHooks' hook result that replaces the function's call (dhooks.inc), "supersede" as it spells it
MRES_Supercede = "MRES_Supercede"
# PSScriptAnalyzer, the PowerShell linter, its cmdlet Invoke-ScriptAnalyzer and its settings file: the
# tool's name keeps its American "z"
PSScriptAnalyzer = "PSScriptAnalyzer"
PSScriptAnalyzerSettings = "PSScriptAnalyzerSettings"
ScriptAnalyzer = "ScriptAnalyzer"
# SSH's per-user key file (authorized_keys, in docs/design): its spelling is the file's
authorized_keys = "authorized_keys"

[files]
extend-exclude = [
  # The games' cvars and commands, by their names (checks/dump_cvars.py)
  "checks/cvars/",
  # Licence texts, as they are
  "LICENSES/",
  # AFK Manager, vendored: its code, include, translations and the configuration generated from it
  "game/common/addons/sourcemod/scripting/afk_manager4.sp",
  "game/common/addons/sourcemod/scripting/include/afk_manager.inc",
  "game/common/addons/sourcemod/translations/afk_manager.phrases.txt",
  "game/common/cfg/sourcemod/afk_manager.cfg",
]
