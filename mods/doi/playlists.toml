# The game's playlists as the servers have them (see nwi-server make-mods). Replacements, which
# nwi_playlist_unlock loads instead of the game's playlists, lift their restrictions: any map and game
# mode, no forced settings and any number of slots (the game's defaults without
# require_maxplayers_min and _max). The settings each playlist forced are taken over as configs instead,
# so the servers get the playlist's gameplay as a baseline, which our configs change where they want to.
# Settings that would get in the way aren't taken over: the theater override and the workshop, which
# the servers use, BattlEye, stats (basic_settings.cfg), and the rules we set differently, like dead
# talk, voice and team kill punishment. The replacements force one setting of their own instead:
# BattlEye off, which the game no longer has (docs/Cvars.md). Forced, the setting is hidden from the
# console, and the server never looks for BattlEye's library.

[[replace]]
playlists = ["*"]
drop = [
  "allowed_maps",
  "forced_cvars",
  "forced_cvars_dedicated",
  "require_maxplayers_min",
  "require_maxplayers_max",
]
set = { forced_cvars = { sv_battleye = "0" } }

# The rulesets force no settings either, and run any map, except the campaigns (american_campaign and
# the like), which keep their maps and the teams they set: a campaign is a choice of maps
[[replace.ruleset]]
rulesets = ["*"]
drop = ["forced_cvars", "forced_cvars_dedicated", "require_maxplayers_min", "require_maxplayers_max"]

[[replace.ruleset]]
rulesets = ["*"]
exclude = ["*_campaign"]
drop = ["allowed_maps"]

[[playlist]]
name = "nwi/coop_commando"
include = [
  # Elite bots, their rankings, respawn time and difficulty
  "doi_*",
  "sv_firesupport_cooldown_frac",
  "sv_hud_targetindicator*",
  "mp_supply_gain_*",
  "mp_stronghold_bot_respawn_friendly",
]

[[playlist]]
name = "nwi/mp_battles"
include = [
  # No bots on an empty server's teams
  "doi_bot_quota",
  # Supply, and per game mode the supply of a capture
  "mp_supply_*",
  "sv_hud_*",
  "sv_allow_jumpshot",
]

# The bot soak test's (servers/soak-bots): its bots, which soak_bots.cfg sets to 20 a team
[[playlist]]
name = "nwi/mp_casual_with_bots"
include = ["doi_bot_quota"]
