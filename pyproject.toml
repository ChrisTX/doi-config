# nwi-server-kit, the Python package of the servers' tools (src/nwi_server_kit) with its command
# nwi-server, and the dependencies of it and the scripts of tools/. uv sync makes .venv with the
# versions of uv.lock and the package installed from the checkout (see CONTRIBUTING.md); the servers'
# package (deploy/arch/PKGBUILD) installs it with the Arch Linux packages of the dependencies.

[project]
name = "nwi-server-kit"
version = "0"
description = "Tools of Day of Infamy and Insurgency servers on systemd"
requires-python = ">=3.12"
license = "MIT"
# The Arch Linux packages of the same libraries in parentheses
dependencies = [
  "python-a2s>=1.4",  # srcds_watchdog.py's queries of the servers (python-a2s)
  "srctools>=2.7",  # the game's KeyValues, Steam's VDF and the VPKs (python-srctools)
]

[project.scripts]
nwi-server = "nwi_server_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwi_server_kit"]

[tool.ruff]
# The package, and the scripts' own modules, e.g. rcon.py, which they import from tools/
src = ["src", "tools"]
