# nwi-server-kit, the Python package of the servers' tools (src/nwi_server_kit) with its command
# nwi-server, and the dependencies of it and the scripts of tools/. uv sync makes .venv with the
# versions of uv.lock and the package installed from the checkout (see CONTRIBUTING.md); the servers'
# package (deploy/arch/PKGBUILD) installs it with the Arch Linux packages of the dependencies.

[project]
name = "nwi-server-kit"
version = "0"
description = "Tools of Day of Infamy and Insurgency servers on systemd"
requires-python = ">=3.12"
license = "MIT"
# The Arch Linux packages of the same libraries in parentheses
dependencies = [
  "python-a2s>=1.4",  # srcds_watchdog.py's queries of the servers (python-a2s)
  "srctools>=2.7",  # the game's KeyValues, Steam's VDF and the VPKs (python-srctools)
]

[project.scripts]
nwi-server = "nwi_server_kit.cli:main"

# The checks of the git hooks that need the dependencies: in .venv, mypy sees them (CONTRIBUTING.md)
[dependency-groups]
dev = ["mypy>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwi_server_kit"]

[tool.mypy]
files = ["src", "tools"]
python_version = "3.12"
# The bodies of functions without annotations too, e.g. of the scripts of tools/
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Libraries without types: python-a2s (srcds_watchdog.py), and those of the Ghidra tools (tools/ghidra:
# python-pyelftools, python-capstone, python-pefile), which the virtual environment doesn't have
[[tool.mypy.overrides]]
module = ["a2s", "a2s.*", "elftools.*", "capstone", "capstone.*", "pefile"]
ignore_missing_imports = true

[tool.ruff]
# The package, and the scripts' own modules, e.g. rcon.py, which they import from tools/
src = ["src", "tools"]
