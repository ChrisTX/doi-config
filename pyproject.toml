# nwi-server-kit, the Python package of the servers' tools (src/nwi_server_kit) with its command
# nwi-server, and the dependencies of it and the scripts of checks/ and testing/. uv sync makes .venv with the
# versions of uv.lock and the package installed from the checkout (see CONTRIBUTING.md); the servers'
# package (deploy/arch/PKGBUILD) installs it with the Arch Linux packages of the dependencies.

[project]
name = "nwi-server-kit"
version = "0"
description = "Tools of Day of Infamy and Insurgency servers on systemd"
requires-python = ">=3.12"
license = "MIT"
# The Arch Linux packages of the same libraries in parentheses
dependencies = [
  "cryptography>=50.0.2",  # the VPKs' signatures (python-cryptography)
  "python-a2s>=1.4",  # the watchdog's queries of the servers (python-a2s)
  "srctools>=2.7",  # the game's KeyValues, Steam's VDF and the VPKs (python-srctools)
]

[project.scripts]
hl2sdk-ghidra = "hl2sdk_ghidra.cli:main"
nwi-rcon = "nwi_server_kit.cli.rcon:main"
nwi-server = "nwi_server_kit.cli:main"

# hl2sdk-ghidra's (src/hl2sdk_ghidra): Ghidra through PyGhidra, with JPype (python-jpype1, AUR), and
# the ELF's DWARF, the disassembler and Windows' PE files
[project.optional-dependencies]
ghidra = [
  "pyghidra>=3.2",  # Ghidra 12.2's own (ghidra)
  "JPype1>=1.5.2",  # (python-jpype1, AUR)
  "pyelftools>=0.33",  # (python-pyelftools)
  "capstone>=5.0.9",  # (python-capstone)
  "pefile>=2024.8.26",  # (python-pefile)
]

# The checks of the git hooks that need the dependencies: in .venv, mypy and pytest see them
# (CONTRIBUTING.md). The Arch Linux packages in parentheses.
[dependency-groups]
dev = [
  # The types of Ghidra's API for mypy, of the installed Ghidra (ghidra)
  "ghidra-stubs",
  "mypy>=2.4",  # (mypy)
  "nwi-server-kit[ghidra]",
  "pytest>=9.2",  # (python-pytest)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwi_server_kit", "src/hl2sdk_ghidra"]

[tool.mypy]
files = ["src", "checks", "testing", "tests"]
python_version = "3.12"
# The bodies of functions without annotations too, e.g. of the scripts of checks/ and testing/
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Libraries without types: python-a2s (watchdog.py), and those of hl2sdk-ghidra
# (python-pyelftools, python-capstone, python-pefile)
[[tool.mypy.overrides]]
module = ["a2s", "a2s.*", "elftools.*", "capstone", "capstone.*", "pefile"]
ignore_missing_imports = true

# Java's classes through JPype, which have no stubs; and Ghidra's and PyGhidra's, which are checked
# where they're installed, the virtual environment, and taken as they are without
[[tool.mypy.overrides]]
module = ["java", "java.*", "ghidra", "ghidra.*", "pyghidra", "pyghidra.*"]
ignore_missing_imports = true

# Ghidra's own stubs (ghidra-stubs) of its JIT emulator, which aren't valid Python ($ in names)
[[tool.mypy.overrides]]
module = ["ghidra.pcode.emu.jit.gen", "ghidra.pcode.emu.jit.gen.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# The tests of the package
[tool.pytest]
addopts = ["--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# The package, which the scripts of checks/ and testing/ import from src/
src = ["src"]

[tool.uv.sources]
ghidra-stubs = { path = "/opt/ghidra/docs/ghidra_stubs/ghidra_stubs-12.2-py3-none-any.whl" }
