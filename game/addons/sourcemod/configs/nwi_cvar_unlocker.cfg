// The cvars nwi_cvar_unlocker.smx changes, by game folder (doi, insurgency). It sets them again at
// each map start, as the game may reset them.
//
// "bounds": a cvar's new bounds, "<min> <max>"; "-" keeps the game's bound. The max can be
// "team_slots <limit>": half of the server's slots, without SourceTV's, at most <limit>.
// "remove_flags": flags taken from a cvar, "cheat" (settable without sv_cheats) and "notify" (changes
// aren't announced to the players), several separated by spaces.
//
// tools/check_configs.py checks the configs against these bounds and flags.
"nwi_cvar_unlocker"
{
    "doi"
    {
        "bounds"
        {
            // The coop lobby, the human players, can take the slots of their team: 16 by the game's
            // rules, with maxplayers 33 (basic_coop.cfg), but fewer with fewer slots. The game's own
            // bound is 25. mp_coop_lobbysize is Insurgency's, which Day of Infamy may not use any more.
            "doi_coop_lobby_size"       "- team_slots 16"
            "mp_coop_lobbysize"         "- team_slots 16"
            // The round and game phase timers, up to ten minutes
            "mp_timer_pregame"          "- 600"
            "mp_timer_postgame"         "- 600"
            "mp_timer_postround"        "- 600"
            "mp_timer_preround"         "- 600"
            "mp_timer_preround_first"   "- 600"
            "mp_timer_preround_switch"  "- 600"
            "mp_timer_taglines"         "- 600"
            "mp_timer_voting"           "- 600"
        }
        "remove_flags"
        {
            // Bot behaviour, set by doi-config/bot_logic.cfg
            "doi_bot_aim_aimtracking_base"          "cheat"
            "doi_bot_awareness_conversation_range"  "cheat"
            "doi_bot_fov_idle"                      "cheat"
            "doi_bot_newthreat_search_interval"     "cheat"
            "doi_bot_path_compute_throttle_combat"  "cheat"
            "doi_bot_path_compute_throttle_idle"    "cheat"
            "doi_bot_silhouette_discover_timer"     "cheat"
            "doi_bot_silhouette_scan_frequency"     "cheat"
            "doi_bot_vis_foliage_threshold"         "cheat"
            // Proximity voice chat ranges, set by doi-config/basic_pvp.cfg
            "mp_voice_max_distance_friendly"        "cheat"
            "mp_voice_max_distance_enemy"           "cheat"
            // Not set by any config of this repository, so only by hand
            "sv_radial_debug_artillery"             "cheat"
        }
    }
    "insurgency"
    {
    }
}
