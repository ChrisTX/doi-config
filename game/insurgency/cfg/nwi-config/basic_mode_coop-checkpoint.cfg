// Checkpoint on Insurgency's servers, to try the difficulty scaler with Insurgency: its bots
// scaled to the human players at every round start (nwi_difficulty_scaler.smx), as Day of Infamy's
// Stronghold, 3 and 2 more a player, at most a team's slots. Not a balance that was played: a start
// for one. The plugin sets the game mode's set bot count, ins_bot_count_checkpoint.
nwi_mode_cvar "nwi_scaler_enabled" "1"
nwi_mode_cvar "nwi_scaler_enemy_base" "3"
nwi_mode_cvar "nwi_scaler_enemy_per_player" "2"
