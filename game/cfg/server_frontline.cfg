// Frontline (PvP), run at every map start in this mode, after the configuration (see
// doi-config/init-*.cfg)
exec doi-config/basic_mode_pvp.cfg

"mp_supply_gain_obj_cap" "2" // from nwi/mp_battles

// Games before the map changes, rounds per game, and the round wins that end a game
"mp_maxgames" "1"
"mp_maxrounds" "3"
"mp_winlimit" "2"
// Time per map in minutes, round time in seconds
"mp_timelimit" "20"
"mp_roundtime" "900"
// A point's capture time in seconds, and no decay of the progress when the capturers leave
"mp_cp_capture_time" "60"
"mp_cp_deteriorate_time" "0"
// Reinforcement waves
"mp_waves_enabled" "1"
// Seconds between reinforcement waves at most
"mp_respawnwavetime_max" "50"
// Reinforcement waves: the share of a team's players that have to be dead for a wave, the waves per
// team and those a capture adds
"mp_wave_dpr_perteam" "0.05"
"mp_wave_count_perteam" "5"
"mp_wave_capture_increment" "1"
// Spawn protection in seconds
"mp_spawnprotectontime" "20"
// Supply the players start with
"mp_supply_token_base" "10"
// Whether the teams switch sides after each round, and after each game
"mp_switchteams_each_round" "0"
"mp_switchteams_each_game" "0"
// Each further player on a point speeds the capture up by this rate, with a radio by the radio rate,
// counting this many players at most
"mp_cp_speedup_rate" "0.35"
"mp_cp_radio_speedup_rate" "0.60"
"mp_cp_speedup_max" "6"
// Not a cvar of the game, which has mp_artillery_cooldown_attack and mp_artillery_cooldown_defend only
// (for offensive and invasion): this has no effect
"mp_artillery_cooldown" "45"
