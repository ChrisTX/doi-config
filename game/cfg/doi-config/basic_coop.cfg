// The basic settings of the cooperative configurations, after the playlist's (see init-coop-commando.cfg)

// Players of a coop lobby (the game's defaults: 8 and 6)
"doi_coop_lobby_size" "16"
"mp_coop_lobbysize" "16"
// Rounds before the game ends and the map changes
"mp_maxrounds" "5"
// The server's slots, for the players and the bots; the engine reserves one for SourceTV
"maxplayers" "49"

// Bot logic
exec doi-config/bot_logic.cfg

// Remove bot damage reduction: the bots' damage as a fraction (the default, 1)
"bot_damage" "1"

// Remove friendly fire damage reduction: friendly fire does full damage (the game's default is 0.25)
"mp_friendlyfire_damage" "1"

// Reduce bot spam: the bots' respawn time multiplied by this, per difficulty (the game's default is 1).
// This replaces coop_commando.cfg's 1.5, which runs before.
"doi_coop_respawn_frac" "2.5"

// Allow spectating bots
"spec_allow_bots" "1"

// No votes on the number or the difficulty of the bots
"sv_vote_issue_botcount_allowed" "0"
"sv_vote_issue_botdifficulty_allowed" "0"

// Capture time settings
// Make more people on point still rewarding
// but not excessively: each further player on a point speeds the capture up by this rate (0.25 by
// default), with a radio by the radio's rate (0.50), counting at most mp_cp_speedup_max players (5)
"mp_cp_radio_speedup_rate" "0.15"
"mp_cp_speedup_max" "4"
"mp_cp_speedup_rate" "0.20"

// A point's capture progress doesn't decay when the capturers leave it (8 seconds by default)
"mp_cp_deteriorate_time" "0"

// Global audio for DOI: voice isn't spatial, the squad radio carries it
"mp_voice_use_3d_voip" "0"
"mp_voice_squad_radio" "1"
