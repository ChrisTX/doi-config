// The basic settings of the cooperative servers, after the playlist's (configs_after of their server.toml).
// The settings of a playlist are in mode_<playlist>.cfg, those of a game mode in basic_mode_coop*.cfg.

// The coop lobby's 16 players, a whole team (nwi_cvar_unlocker.smx allows it), see docs/Cvars.md:
// the players at which the bot count reaches its most (the game's default 8), and the human slots
// the server reports (the game's default 6, NWI's coop playlists 8)
doi_coop_lobby_size "16"
mp_coop_lobbysize "16"
// Rounds before the game ends and the map changes
mp_maxrounds "5"
// The server's slots, for the players and the bots: a team of 16 each, the players and friendly bots,
// and the enemy bots, and SourceTV's. Only takes effect while the server hibernates, which it does
// when it starts, as this runs.
maxplayers "33"

// Bot logic
exec "doi-config/bot_logic.cfg"

// Remove bot damage reduction: the bots' damage as a fraction (the default, 1)
bot_damage "1"

// Remove friendly fire damage reduction: friendly fire does full damage (the game's default is 0.25)
mp_friendlyfire_damage "1"

// Allow spectating bots
spec_allow_bots "1"

// No votes on the number or the difficulty of the bots
sv_vote_issue_botcount_allowed "0"
sv_vote_issue_botdifficulty_allowed "0"

// Global audio for DOI: voice isn't spatial, the squad radio carries it
mp_voice_use_3d_voip "0"
mp_voice_squad_radio "1"
