// Invasion, in every playlist: the settings of the game mode, which doi_mode_config.smx
// runs after basic_mode_pvp.cfg (see cfg/server_invasion.cfg)

// Games before the map changes, rounds per game, and the round wins that end a game
doi_mode_cvar "mp_maxgames" "1"
doi_mode_cvar "mp_maxrounds" "3"
doi_mode_cvar "mp_winlimit" "2"
// Time per map in minutes, round time in seconds
doi_mode_cvar "mp_timelimit" "20"
doi_mode_cvar "mp_roundtime" "600"
// A point's capture time in seconds, and no decay of the progress when the capturers leave
doi_mode_cvar "mp_cp_capture_time" "80"
doi_mode_cvar "mp_cp_deteriorate_time" "0"
// Seconds between reinforcement waves, at least and at most (the game's descriptions of the two are
// swapped)
doi_mode_cvar "mp_respawnwavetime_min" "20"
doi_mode_cvar "mp_respawnwavetime_max" "30"
// Reinforcement waves of the attackers and the defenders, and those a capture adds
doi_mode_cvar "mp_wave_count_attackers" "15"
doi_mode_cvar "mp_wave_count_defenders" "30"
doi_mode_cvar "mp_wave_capture_increment" "10"
// The share of a team's players that have to be dead for a wave, normally and at the last point
// (finale)
doi_mode_cvar "mp_wave_dpr_attackers" "0.25"
doi_mode_cvar "mp_wave_dpr_attackers_finale" "0.15"
doi_mode_cvar "mp_wave_dpr_defenders" "0.30"
doi_mode_cvar "mp_wave_dpr_defenders_finale" "0.10"
// Seconds after a wave in which another one costs no wave
doi_mode_cvar "mp_wave_grace_period" "30"
// Seconds the players are frozen at the round start, and spawn protection in seconds
doi_mode_cvar "mp_freezetime" "15"
doi_mode_cvar "mp_spawnprotectontime" "30"
// Seconds a capture adds to the round, and the delay of the advanced spawns after a capture
doi_mode_cvar "mp_invasion_capture_time_extension" "480"
doi_mode_cvar "mp_invasion_deferred_advance" "15"
// Supply the players start with
doi_mode_cvar "mp_supply_token_base" "10"
// Whether the teams switch sides after each round, and after each game
doi_mode_cvar "mp_switchteams_each_round" "1"
doi_mode_cvar "mp_switchteams_each_game" "0"
// Each further player on a point speeds the capture up by this rate, with a radio by the radio rate,
// counting this many players at most
doi_mode_cvar "mp_cp_speedup_rate" "0.35"
doi_mode_cvar "mp_cp_radio_speedup_rate" "0.60"
doi_mode_cvar "mp_cp_speedup_max" "6"
// Seconds between artillery bombardments for the attackers and for the defenders
doi_mode_cvar "mp_artillery_cooldown_attack" "30"
doi_mode_cvar "mp_artillery_cooldown_defend" "60"
