// The settings all configurations share, after the playlist's (see init-*.cfg)

// Disable HunkAlloc
// This is needed to prevent crashes with certain maps e.g. ardennes
// Downside is a potentially increased RAM usage, which is irrelevant nowadays
// The servers' command lines set it too (+r_hunkalloclightmaps 0), as it has to be set before the
// first map loads
r_hunkalloclightmaps "0"

// Log setting: logs on, bans logged, the log echoed to the console, written to one file (logs/)
log "on"
sv_logbans "1"
sv_logecho "1"
sv_logfile "1"
sv_log_onefile "1"

// Player settings: spectators allowed, no kicks of team killers or idlers (AFK Manager handles those)
mp_allowspectators "1"
mp_autokick "0"
mp_autokick_idlers "0"

// 128 tick (-tickrate 128 on the servers' command lines): clients send and get 128 updates per
// second, whatever their own settings (64 by default), with the bandwidth that needs. The maximums
// (sv_maxcmdrate, sv_maxupdaterate) follow the tickrate by themselves. net_splitrate sends large
// packets in fewer frames. The doi_physics_timestep plugin keeps the physics at 64 tick's step, as
// grenades bounce excessively otherwise, which was why the servers had gone back to 64 tick.
sv_mincmdrate "128"
sv_minupdaterate "128"
sv_minrate "196608"
sv_maxrate "0"
net_splitrate "2"

// Deadtalk: dead players' voice and chat reach the living
sv_deadvoice "1"
sv_deadtalk "1"

// Enable stats (we claim official playlists): the server library's patch lets a server with custom
// content register for stats (see patches/server_srv.patches)
stats_enabled "1"

// Pure disabled: clients may have files that differ from the server's, as workshop content does
sv_pure "-1"
sv_consistency "0"

// Map voting at the end of a game, for mp_timer_voting seconds (15 by default); no votes on the game
// mode
sv_map_voting "1"
sv_vote_issue_changegamemode_allowed "0"
mp_timer_voting "30"

// Doesn't play well with SourceMod or SourceBans
sv_vote_issue_kick_allowed "0"

// When idle, randomly cycle through our map list: an empty server changes the map after this many
// seconds (an hour by default), to a random one of the map cycle
mp_timelimit_waiting "1200"
mp_timelimit_waiting_random "1"

// Friendly fire settings: friendly fire on, and players can set off their teammates' explosives
mp_friendlyfire "1"
mp_friendlyfire_explosives "1"
mp_tkpunish "1" // How to punish team killing ( 0 = none, 1 = warning, 2 = kill )

sv_hud_deathmessages "1" // death messages
sv_hud_deathmessages_spectator "1"
sv_hud_scoreboard_show_score "1"
sv_hud_targetindicator "1" // show friendly player names when looking at them

// Advertisements: seconds between the messages of addons/sourcemod/configs/advertisements.txt
sm_advertisements_interval "120"
