// The Coop Commando configuration, which a server's server.cfg runs. The configs run in this order, and
// a later one's setting replaces an earlier one's: the settings of the playlist come before the basic
// ones, so basic_settings.cfg and basic_coop.cfg win where they set the same cvar. The game mode's own
// config, cfg/server_<gamemode>.cfg, runs at every map start, after these.
exec doi-config/tv_settings.cfg
exec doi-config/coop_commando.cfg
exec doi-config/basic_settings.cfg
exec doi-config/basic_coop.cfg
