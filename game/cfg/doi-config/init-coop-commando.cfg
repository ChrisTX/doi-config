// The Coop Commando configuration, which a server's server.cfg runs. The configs run in this order, and
// a later one's setting replaces an earlier one's: the settings the playlist nwi/coop_commando forces, as far
// as we take them over (playlists/nwi/coop_commando.cfg, made by tools/make_mods.py from mods/playlists.toml),
// come before ours. The game modes' configs run at every map start, after these (see
// nwi_mode_config.sp).
exec "doi-config/tv_settings.cfg"
exec "doi-config/playlists/nwi/coop_commando.cfg"
exec "doi-config/basic_settings.cfg"
exec "doi-config/basic_coop.cfg"

// The maps the server cycles through
mapcyclefile "cfg/doi-config/mapcycle_coop.txt"
