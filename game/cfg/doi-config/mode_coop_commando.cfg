// Our settings of the playlist nwi/coop_commando, in all its game modes: doi_mode_config.smx runs this
// at every map start, after the game mode's basic configs and the playlist's own settings (see
// cfg/server_<mode>.cfg)

// Friendly players' names show up to this distance in units (the playlist has 100)
doi_mode_cvar "sv_hud_targetindicator_friend_max_distance" "600"

// Reduce bot spam: the bots' respawn time multiplied by this, per difficulty (the playlist has 1.5,
// the game's default is 1)
doi_mode_cvar "doi_coop_respawn_frac" "2.5"

// Capture time settings
// Make more people on point still rewarding
// but not excessively: each further player on a point speeds the capture up by this rate (0.25 by
// default), with a radio by the radio's rate (0.50), counting at most mp_cp_speedup_max players (5)
doi_mode_cvar "mp_cp_radio_speedup_rate" "0.15"
doi_mode_cvar "mp_cp_speedup_max" "4"
doi_mode_cvar "mp_cp_speedup_rate" "0.20"

// A point's capture progress doesn't decay when the capturers leave it (8 seconds by default)
doi_mode_cvar "mp_cp_deteriorate_time" "0"
