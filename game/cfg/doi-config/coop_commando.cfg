/////// PLAYLIST /////////////

// The playlist the server announces, which the game modes' rules and its matchmaking follow
"sv_playlist" "nwi/coop_commando"

"mapcyclefile" "cfg/doi-config/mapcycle_coop.txt"

//Commando
// bump this up a little CC default is 100: friendly players' names show up to this distance in units
"sv_hud_targetindicator_friend_max_distance" "600"
// Elite bots, the enemy quality of Commando
"doi_coop_elitebots" "1"
// Fire support's cooldown multiplied by this
"sv_firesupport_cooldown_frac" "3"
// The bots' respawn time multiplied by this; basic_coop.cfg, which runs after, sets 2.5 instead
"doi_coop_respawn_frac" "1.5"
// The rankings (difficulty) of the officer bots and of the standard ones
"doi_coop_bot_ranking_officer" "6"
"doi_coop_bot_ranking" "5"

// Grunt specific cvars
"doi_bot_difficulty" "1" // Bot difficulty, 0 to 1
"sv_hud_targetindicator" "1" // show friendly player names when looking at them

// Supply gain: kills and assists a player needs for more supply (5 by default)
"mp_supply_gain_kill_assist_threshold" "10"

// Friendly bots that die don't respawn in stronghold
"mp_stronghold_bot_respawn_friendly" "0"

//////////////////////////////
