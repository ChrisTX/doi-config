// The bots' logic, which basic_coop.cfg runs: more often and sharper than the game's defaults, which
// the game tuned for performance

// Bot tickrate settings
// How often a bot samples its target's position and velocity for its aim, in seconds (0.5 by default,
// 0.1 at least)
doi_bot_aim_aimtracking_base 0.1
// Ticks per second of the bots' combat logic (4 by default)
doi_bot_combat_tickrate 32
// Seconds between a bot's searches for new threats (0.25 by default)
doi_bot_newthreat_search_interval 0.05
// The least time in seconds between a bot's path computations, in and out of combat (0.5 and 5 by
// default)
doi_bot_path_compute_throttle_combat 0.05
doi_bot_path_compute_throttle_idle 0.05
// How long in seconds a silhouette stays visible once discovered (3 by default), and the seconds
// between the scans for silhouettes (0.5)
doi_bot_silhouette_discover_timer 0.75
doi_bot_silhouette_scan_frequency 0.05

// Bot difficulty settings
// How far bots hear each other talk, in units (300 by default)
doi_bot_awareness_conversation_range 600
// Bots ignore foliage in their line of sight to targets closer than this, in units (250 by default)
doi_bot_vis_foliage_threshold 100

// Bot accuracy settings: spread is added to or multiplies the bots' aim, so higher is less accurate
// Offset in units added to the bots' aim with launchers (80 by default), and to rocket targets (20)
doi_bot_launcher_bloat 120
doi_bot_rocket_player_cluster_bloat 120
// Spread multiplied at the greatest distance (3 by default, not for MGs) and at hip-fire distance (1)
doi_bot_spread_frac_maxrange 3.5
doi_bot_spread_frac_minrange 1.75
// MGs' spread once zeroed in on a player (0.1 by default), and the seconds they take to zero in (1.5)
doi_bot_spread_mg_zeroed 1.2
doi_bot_spread_mg_zerotimer 2
// Spread added when a bot is suppressed (0.75 by default)
doi_bot_spread_suppressed 2
// Spread added against players who move (0.25 by default), who don't aim at the bot (0.75), and who
// sprint (0.5)
doi_bot_spread_target_moving 0.5
doi_bot_spread_target_not_aiming 0
doi_bot_spread_target_sprinting 0.75
