// What all PvP game modes share, in every playlist: the first of the game mode's configs that
// doi_mode_config.smx runs at every map start (see cfg/server_<mode>.cfg)

// Supply players earn for capturing a point; nwi/mp_battles gives 2 in frontline and offensive
// (playlists/nwi/mp_battles-<mode>.cfg, made by tools/make_mods.py)
doi_mode_cvar "mp_supply_gain_obj_cap" "1"
