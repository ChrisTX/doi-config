// The PvP Battles configuration, which a server's server.cfg runs. The configs run in this order, and
// a later one's setting replaces an earlier one's: the settings the playlist nwi/mp_battles forces, as far
// as we take them over (playlists/nwi/mp_battles.cfg, made by tools/make_mods.py from mods/playlists.toml),
// come before ours. The game modes' configs run at every map start, after these (see
// cfg/server_<mode>.cfg).
exec "doi-config/tv_settings.cfg"
exec "doi-config/playlists/nwi/mp_battles.cfg"
exec "doi-config/basic_settings.cfg"
exec "doi-config/basic_pvp.cfg"

// The maps the server cycles through
mapcyclefile "cfg/doi-config/mapcycle_pvp.txt"
