// The PvP Battles configuration, which a server's server.cfg runs. The configs run in this order, and a
// later one's setting replaces an earlier one's: the settings of the playlist come before the basic
// ones. The game mode's own config, cfg/server_<gamemode>.cfg, runs at every map start, after these.
exec doi-config/tv_settings.cfg
exec doi-config/mp_battles.cfg
exec doi-config/basic_settings.cfg
exec doi-config/basic_pvp.cfg
