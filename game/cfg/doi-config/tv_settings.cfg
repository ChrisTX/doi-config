// SourceTV, the spectator relay, which every configuration has

// The server keeps running without players: SourceTV and the empty server's map changes need it
sv_hibernate_when_empty 0
// SourceTV on, without recording demos, for up to 16 spectators
tv_enable 1
tv_autorecord 0
tv_maxclients 16
// No broadcast delay (30 seconds by default), and map changes don't wait for the broadcast
tv_delay 0
tv_delaymapchange 0
// Each spectator's bandwidth at most, in bytes per second (0 is unlimited), and the snapshots
// broadcast per second
tv_maxrate 8000
tv_snapshotrate 16
// Spectators are sent to relay proxies where that's appropriate
tv_dispatchmode 1
// Voice relayed to the spectators, all entities sent (not only the director's view), no chat groups
tv_relayvoice 1
tv_transmitall 1
tv_chatgroupsize 0
// The auto director may use the level's fixed cameras, and spectators may become camera men
tv_allow_static_shots 1
tv_allow_camera_man 1
