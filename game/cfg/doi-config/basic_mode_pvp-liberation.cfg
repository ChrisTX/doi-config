// Liberation, in every playlist: the settings of the game mode, which nwi_mode_config.smx
// runs after basic_mode_pvp.cfg (see cfg/server_liberation.cfg)

// Games before the map changes, rounds per game, and the round wins that end a game
nwi_mode_cvar "mp_maxgames" "1"
nwi_mode_cvar "mp_maxrounds" "3"
nwi_mode_cvar "mp_winlimit" "2"
// Time per map in minutes, round time in seconds
nwi_mode_cvar "mp_timelimit" "20"
nwi_mode_cvar "mp_roundtime" "600"
// A point's capture time in seconds, and no decay of the progress when the capturers leave
nwi_mode_cvar "mp_cp_capture_time" "60"
nwi_mode_cvar "mp_cp_deteriorate_time" "0"
// Reinforcement waves
nwi_mode_cvar "mp_waves_enabled" "1"
// Seconds between reinforcement waves at most
nwi_mode_cvar "mp_respawnwavetime_max" "35"
// Reinforcement waves: the share of a team's players that have to be dead for a wave, the waves per
// team and those a capture adds
nwi_mode_cvar "mp_wave_dpr_perteam" "0.05"
nwi_mode_cvar "mp_wave_count_perteam" "5"
nwi_mode_cvar "mp_wave_capture_increment" "1"
// Spawn protection in seconds
nwi_mode_cvar "mp_spawnprotectontime" "20"
// Supply the players start with
nwi_mode_cvar "mp_supply_token_base" "10"
// Whether the teams switch sides after each round, and after each game
nwi_mode_cvar "mp_switchteams_each_round" "0"
nwi_mode_cvar "mp_switchteams_each_game" "0"
// Each further player on a point speeds the capture up by this rate, with a radio by the radio rate,
// counting this many players at most
nwi_mode_cvar "mp_cp_speedup_rate" "0.35"
nwi_mode_cvar "mp_cp_radio_speedup_rate" "0.60"
nwi_mode_cvar "mp_cp_speedup_max" "6"
