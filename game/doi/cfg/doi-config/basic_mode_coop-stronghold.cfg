// Stronghold, in every playlist: the settings of the game mode, which nwi_mode_config.smx
// runs after basic_mode_coop.cfg (see cfg/server_stronghold.cfg)

// Round time in seconds
nwi_mode_cvar "mp_roundtime" "1200"
// A point's capture time in seconds
nwi_mode_cvar "mp_cp_capture_time" "160"

// The bots, scaled to the human players at every round start (nwi_difficulty_scaler.smx): 3 enemies
// and 2 more a player, 5 friendlies and 1 more a player, at most a team's slots
nwi_mode_cvar "nwi_scaler_enabled" "1"
nwi_mode_cvar "nwi_scaler_enemy_base" "3"
nwi_mode_cvar "nwi_scaler_enemy_per_player" "2"
nwi_mode_cvar "nwi_scaler_friendly_base" "5"
nwi_mode_cvar "nwi_scaler_friendly_per_player" "1"
